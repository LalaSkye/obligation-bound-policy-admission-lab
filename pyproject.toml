[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obligation-bound-policy-admission-lab"
version = "0.6.0"
description = "A bounded, attackable reference harness for obligation-bound policy admission."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
